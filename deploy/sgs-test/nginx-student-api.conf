# Add inside the EXISTING HTTPS server {} for sgs-test/sss-test.
# Do not replace the server block or the existing faculty /api/v1 location.
location ^~ /api/student/ {
    # The trailing slash strips /api/student/ before forwarding to FastAPI.
    proxy_pass http://127.0.0.1:4109/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 10m;
    proxy_read_timeout 120s;
}
